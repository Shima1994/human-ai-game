[server]
# Required so the self-hosted fonts under static/fonts/ can be served
# instead of loading them from the Google Fonts CDN.
enableStaticServing = true

[client]
# Never show participants a Python traceback on an unhandled exception.
# "none" is the modern, unambiguous value (hides type/stacktrace/message);
# the legacy boolean "false" maps to the same thing but is being phased out.
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[theme]
# Without this, Streamlit follows the participant's OS/browser dark-mode
# preference for every *native* widget it draws (multiselect, selectbox,
# radio, checkbox...) while our custom CSS in static/app.css only ever
# targets the light palette below. A participant (or reviewer) with dark
# mode on saw exactly that mismatch: our light cards next to native widgets
# rendered dark, with washed-out/invisible labels wherever a light-mode
# text color landed on a dark-mode widget background. Forcing base="light"
# makes every participant see the identical, tested appearance regardless
# of their device's own theme setting.
base = "light"
primaryColor = "#1d5ea8"
backgroundColor = "#f6f4ef"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2d3d"
font = "sans serif"

[runner]
# Never run two script runs of the same session at once. With fast reruns on
# (Streamlit's default), a click that arrived while a run was still busy --
# e.g. waiting for the AI or the database -- started a second run right away
# while the first was still finishing, and the two then changed the same
# session state: a clue was submitted to the AI twice, and a recorded turn
# was once recorded again as a timeout. With this off, the new run starts
# only once the earlier one has stopped, and the click is not lost.
fastReruns = false
